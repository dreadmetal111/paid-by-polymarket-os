[Unit]
Wants=systemd-networkd-wait-online@wlp1s0.service
After=systemd-networkd-wait-online@wlp1s0.service

[Service]
ExecStartPre=
ExecStartPre=/bin/bash -c 'for i in {1..15}; do /usr/bin/curl -fsS --connect-timeout 2 --max-time 3 -o /dev/null https://www.cloudflare.com/cdn-cgi/trace && /usr/bin/getent ahosts paid-by-polymarket-os.onrender.com >/dev/null 2>&1 && exit 0; /usr/bin/sleep 2; done; exit 1'
